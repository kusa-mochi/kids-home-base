# kids-home-base フロントエンド公開用 nginx 設定ファイル。
# 自宅内LAN限定・HTTP・ポート23000で、フロントエンド(静的ファイル)とバックエンドAPI(localhost:21226へのリバースプロキシ)を配信する。
# root権限を持たない非rootユーザーで実行される想定のため、pid/一時ファイル/ログの出力先は /tmp とstdout/stderrにしている。

pid /tmp/nginx.pid;
worker_processes 1;

events {
    # 想定最大同時アクセス端末数は6台程度のため、少ないコネクション数で足りる。
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile      on;
    keepalive_timeout 65;
    gzip          on;

    server {
        # 自宅内LANのみで公開する。サーバのIPアドレスは192.168.0.100固定、TLSは使用しない。
        listen 23000;
        server_name 192.168.0.100;

        root /usr/share/nginx/html;
        index index.html;

        # src/backend/main.go に登録されているAPIエンドポイントをバックエンド(localhost:21226)へ中継する。
        location ~ ^/(ping|echo|get-today-schedule|get-tomorrow-schedule|get-upcoming-schedule|add-schedule-item|update-schedule-item-with-id|delete-schedule-item|add-recurring-schedule-item|update-recurring-schedule-item-with-id|delete-recurring-schedule-item|login)$ {
            proxy_pass http://127.0.0.1:21226;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # JWT認証が必要なAPIエンドポイント。
        location /auth/ {
            proxy_pass http://127.0.0.1:21226;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # フロントエンドの静的ファイル(Next.jsの静的出力)を配信する。
        location / {
            try_files $uri $uri.html $uri/index.html /index.html;
        }
    }
}
